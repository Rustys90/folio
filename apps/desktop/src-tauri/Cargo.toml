[package]
name = "folio"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
authors = ["Folio contributors"]
description = "Folio — a free, open-source alternative to Notion (desktop shell)"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# This feature is used for production builds or when `devUrl` is set to an
# external URL. Tauri enables all protocol features by default in this release,
# but you can toggle them from the "tauri" dependency features block.
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
